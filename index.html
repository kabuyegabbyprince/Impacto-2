    <script>
      // Early protection against third-party browser extensions (e.g. MetaMask, Phantom)
      // injecting into iframe/preview environments and throwing unhandled errors.
      (function() {
        var isIgnoredError = function(str) {
          if (!str) return false;
          var s = String(str).toLowerCase();
          return s.indexOf("metamask") !== -1 ||
                 s.indexOf("failed to connect to metamask") !== -1 ||
                 s.indexOf("ethereum") !== -1 ||
                 s.indexOf("web3") !== -1 ||
                 s.indexOf("wallet") !== -1 ||
                 s.indexOf("failed to fetch") !== -1;
        };

        window.addEventListener("unhandledrejection", function(event) {
          var reason = event.reason ? (event.reason.message || event.reason.stack || event.reason) : "";
          if (isIgnoredError(reason)) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return false;
          }
        }, true);

        window.addEventListener("error", function(event) {
          var msg = event.message || (event.error && event.error.message) || "";
          if (isIgnoredError(msg)) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return false;
          }
        }, true);

        if (typeof window.fetch === "function") {
          var nativeFetch = window.fetch;
          window.fetch = function() {
            var fetchArgs = arguments;
            return nativeFetch.apply(window, fetchArgs).catch(function(err) {
              var errMsg = err && (err.message || String(err));
              if (errMsg && String(errMsg).toLowerCase().indexOf("failed to fetch") !== -1) {
                return new Response(JSON.stringify({ error: "Network unavailable", message: errMsg, data: null }), {
                  status: 503,
                  statusText: "Service Unavailable",
                  headers: { "Content-Type": "application/json" }
                });
              }
              return Promise.reject(err);
            });
          };
        }

        var origConsoleError = console.error;
        console.error = function() {
          var args = Array.prototype.slice.call(arguments);
          var joined = args.map(function(a) { return (a && a.message) || String(a); }).join(" ");
          if (isIgnoredError(joined)) {
            return;
          }
          return origConsoleError.apply(console, arguments);
        };
      })();
    </script>

    <script>
      // Global mobile virtual keyboard scroll-into-view & visual viewport focus-lock adjustment
      (function() {
        if (typeof window === "undefined") return;
        
        function updateVisibleHeight() {
          var vh = window.visualViewport ? window.visualViewport.height : window.innerHeight;
          document.documentElement.style.setProperty("--app-visible-height", vh + "px");
        }

        function scrollActiveIntoView() {
          updateVisibleHeight();
          var el = document.activeElement;
          if (el && (el.tagName === "INPUT" || el.tagName === "TEXTAREA" || el.tagName === "SELECT")) {
            setTimeout(function() {
              try {
                el.scrollIntoView({ behavior: "smooth", block: "center", inline: "nearest" });
              } catch (e) {
                el.scrollIntoView();
              }
            }, 250);
          }
        }

        window.addEventListener("focusin", function(e) {
          if (e.target && (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA" || e.target.tagName === "SELECT")) {
            setTimeout(function() {
              try {
                e.target.scrollIntoView({ behavior: "smooth", block: "center", inline: "nearest" });
              } catch (err) {
                e.target.scrollIntoView();
              }
            }, 300);
          }
        }, true);

        if (window.visualViewport) {
          window.visualViewport.addEventListener("resize", scrollActiveIntoView);
          window.visualViewport.addEventListener("scroll", updateVisibleHeight);
        }
        window.addEventListener("resize", updateVisibleHeight);
        window.addEventListener("load", updateVisibleHeight);
        document.addEventListener("DOMContentLoaded", updateVisibleHeight);
        updateVisibleHeight();
      })();
    </script>

    <script>
      (function() {
        try {
          localStorage.removeItem("impacto_user");
          localStorage.removeItem("impacto_session");
          localStorage.removeItem("impacto_active_org");
          localStorage.removeItem("impacto_active_member");
          sessionStorage.clear();
          var primary = "#15803D";
          var secondary = "#F59E0B";
          var theme = localStorage.getItem("theme") || "light";
          var root = document.documentElement;
          root.style.setProperty("--org-primary", primary);
          root.style.setProperty("--org-primary-rgb", "21, 128, 61");
          root.style.setProperty("--org-primary-l", "rgba(21, 128, 61, 0.12)");
          root.style.setProperty("--org-primary-d", "rgb(0, 93, 26)");
          root.style.setProperty("--org-secondary", secondary);
          if (theme === "dark") {
            root.setAttribute("data-theme", "dark");
            root.classList.add("dark");
          } else {
            root.setAttribute("data-theme", "light");
            root.classList.remove("dark");
          }
        } catch (e) {}
      })();
    </script>
